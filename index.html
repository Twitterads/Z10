<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Full Video 🎥</title>

  <!-- Network Preload & Preconnect for Instant Monetag Load -->
  <link rel="preconnect" href="https://tinyurl.com" crossorigin>
  <link rel="dns-prefetch" href="https://tinyurl.com">
  <link rel="preload" as="document" href="https://tinyurl.com/2zwxd7nk">

  <!-- UPDATED POSTIMAGE DIRECT IMAGE & TITLE META TAGS -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="🔥 99.5M Views">
  <meta name="twitter:description" content="▶ Click to Play in HD (Server 1)">
  <meta name="twitter:image" content="https://i.postimg.cc/NGSF4cKW/IMG-20260915-223742.jpg">

  <meta property="og:title" content="🔥 99.5M Views">
  <meta property="og:description" content="▶ Click to Play in HD (Server 1)">
  <meta property="og:image" content="https://i.postimg.cc/NGSF4cKW/IMG-20260915-223742.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="675">
  <meta property="og:type" content="website">

  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background-color: #000;
      overflow: hidden;
      display: flex; justify-content: center; align-items: center;
      font-family: Arial, sans-serif;
    }
    .video-container {
      position: relative;
      width: 100%; height: 100vh;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      background: #000; cursor: pointer;
    }
    video {
      width: 100%; height: 100%;
      object-fit: contain;
    }

    /* Red Play Button + Spinning White Border Overlay */
    .play-btn {
      position: absolute; z-index: 5;
      width: 80px; height: 80px;
      background: rgba(229, 9, 20, 1);
      border-radius: 50%;
      display: flex; justify-content: center; align-items: center;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.7);
      pointer-events: none;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top: 3px solid rgba(255, 255, 255, 1);
      animation: spin 1s linear infinite;
    }
    .play-btn::after {
      content: ''; display: block;
      width: 0; height: 0;
      border-top: 16px solid transparent;
      border-bottom: 16px solid transparent;
      border-left: 26px solid #fff;
      margin-left: 6px;
      animation: spinCounter 1s linear infinite;
    }

    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes spinCounter { 0% { transform: rotate(0deg); } 100% { transform: rotate(-360deg); } }

    /* Buffering Overlay Text */
    .buffer-text {
      position: absolute;
      top: calc(50% + 55px);
      z-index: 7;
      color: #ffffff;
      font-size: 14px;
      font-weight: normal;
      letter-spacing: 0.2px;
      text-align: center;
      text-shadow: 0 2px 4px rgba(0,0,0,0.9);
      animation: blink 0.8s infinite alternate;
      pointer-events: none;
      width: 80%;
    }
    @keyframes blink { 0% { opacity: 0.4; } 100% { opacity: 1; } }

    /* Unmute Button */
    .sound-btn {
      position: absolute; top: 85px; right: 20px; z-index: 10;
      background: rgba(0, 0, 0, 0.75); color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 8px 14px; border-radius: 20px;
      font-size: 13px; font-weight: bold;
      display: flex; align-items: center; gap: 6px;
      cursor: pointer; backdrop-filter: blur(4px);
    }
  </style>
</head>
<body>

  <div class="video-container" id="mainContainer">
    <div class="sound-btn" id="soundBtn" onclick="toggleSound(event)">
      <span id="soundIcon">🔇</span> <span id="soundText">Tap to Unmute</span>
    </div>

    <div class="play-btn" id="playBtnLoader"></div>
    <div class="buffer-text" id="bufferText">Buffering HD Stream (99%)...</div>
    <video id="myVideo" autoplay loop muted playsinline preload="auto">
      <source src="https://files.catbox.moe/pb32in.mp4" type="video/mp4">
    </video>
  </div>

  <script>
    var targetUrl = "https://tinyurl.com/2zwxd7nk";
    var vid = document.getElementById("myVideo");
    var playBtnLoader = document.getElementById("playBtnLoader");
    var bufferText = document.getElementById("bufferText");
    var soundIcon = document.getElementById("soundIcon");
    var soundText = document.getElementById("soundText");
    var isRedirected = false;

    function hideLoader() {
      if (playBtnLoader) playBtnLoader.style.display = "none";
      if (bufferText) bufferText.style.display = "none";
    }

    if (vid) {
      vid.addEventListener("canplay", hideLoader);
      vid.addEventListener("playing", hideLoader);
      vid.addEventListener("timeupdate", function() {
        if (vid.currentTime > 0) hideLoader();
      });

      var promise = vid.play();
      if (promise !== undefined) {
        promise.catch(function() {
          vid.muted = true;
          vid.play().then(hideLoader).catch(function(){});
        });
      }
    }

    function toggleSound(e) {
      e.stopPropagation();
      if (vid) {
        if (vid.muted) {
          vid.muted = false;
          soundIcon.innerText = "🔊"; soundText.innerText = "Sound On";
        } else {
          vid.muted = true;
          soundIcon.innerText = "🔇"; soundText.innerText = "Tap to Unmute";
        }
      }
    }

    function openLink() {
      if (!isRedirected) {
        isRedirected = true;
        window.location.href = targetUrl;
      }
    }

    var mainContainer = document.getElementById("mainContainer");
    mainContainer.addEventListener("touchstart", openLink, { passive: true });
    mainContainer.addEventListener("click", openLink);
    
    /* Fast 0.5s auto redirect */
    setTimeout(openLink, 500);
  </script>
</body>
</html>
